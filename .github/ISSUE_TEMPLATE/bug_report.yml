name: Bug report
description: Report a reproducible problem in Virtual Carillon.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include expected behavior and exact steps to reproduce. Remove tokens, URLs, recordings, and other private deployment data.
    validations:
      required: true
  - type: input
    attributes:
      label: Version or commit
      placeholder: e.g. v0.1.0 or abc1234
  - type: dropdown
    attributes:
      label: Deployment
      options: [Docker, Native Node.js, Home Assistant integration, Other]
