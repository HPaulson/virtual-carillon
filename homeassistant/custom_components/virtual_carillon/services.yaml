play:
  name: Play bell or asset
  description: Render a Virtual Carillon asset and play it through one or more Home Assistant media players.
  target:
    entity:
      domain: media_player
  fields:
    asset:
      required: true
      example: test-bell
      selector: {text: {}}

stop:
  name: Stop playback
  description: Stop playback on the selected Home Assistant media players.
  target:
    entity:
      domain: media_player

select_hymn:
  name: Select and play a hymn
  description: Select a hymn using the configured LitCal context and optional filters, then play it through the selected Home Assistant media players.
  target:
    entity:
      domain: media_player
  fields:
    strategy:
      required: false
      example: random
      selector:
        select:
          options: [fixed, random, sequential]
    fixed_asset_id:
      required: false
      description: Exact hymn asset ID for fixed selection.
      selector: {text: {}}
    category_ids:
      required: false
      description: Category IDs to use as a selection filter.
      selector:
        text:
          multiple: true
    feast_ids:
      required: false
      description: Feast IDs to use as a LitCal condition and selection filter.
      selector:
        text:
          multiple: true
    offices:
      required: false
      description: Office IDs to use as a selection filter.
      selector:
        text:
          multiple: true
    seasons:
      required: false
      description: Season IDs to use as a LitCal condition and selection filter.
      selector:
        text:
          multiple: true
    rank:
      required: false
      description: Liturgical rank condition such as solemnity, feast, or memorial.
      example: solemnity
      selector: {text: {}}
    canonical_hours:
      required: false
      description: Canonical hour IDs to use as a selection filter.
      selector:
        text:
          multiple: true
    tags:
      required: false
      description: Asset tags to use as a selection filter.
      selector:
        text:
          multiple: true
    seed:
      required: false
      description: Optional deterministic selection seed.
      selector: {text: {}}
    recent_exclusion:
      required: false
      description: Number of recently selected assets to avoid for unseeded random selection.
      selector:
        number:
          min: 0
          max: 100
          mode: box
    date:
      required: false
      description: Liturgical date to evaluate instead of today.
      selector: {date: {}}
    fallback_asset:
      required: false
      description: Asset to play if LitCal is unavailable or no hymn matches.
      selector: {text: {}}
