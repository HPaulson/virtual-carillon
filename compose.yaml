services:
  virtual-carillon:
    build:
      context: .
      dockerfile: Dockerfile
    image: virtual-carillon:latest
    restart: unless-stopped
    expose:
      - "9876"
    ports:
      - "9876:9876"
    env_file: .env
    volumes:
      - virtual-carillon-data:/app/.data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9876/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  virtual-carillon-data:
