name: Virtual Carillon
version: 0.1.0-beta.3
slug: virtual_carillon
description: Virtual Carillon turns your speakers into a programmable carillon. Play Westminster Chimes, the Angelus, and liturgically-appropriate Catholic hymns.
url: https://github.com/HPaulson/virtual-carillon
image: ghcr.io/hpaulson/virtual-carillon
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ports:
  9876/tcp: 9876
ports_description:
  9876/tcp: Virtual Carillon API
watchdog: http://[HOST]:[PORT:9876]/health
options:
  api_token: null
  distance_profile: half-mile
  sample_rate: '44100'
  litcal_url: https://litcal.johnromanodorazio.com/api/v5
  litcal_calendar: general
schema:
  api_token: password
  distance_profile: list(near|church-grounds|quarter-mile|half-mile|one-mile)
  sample_rate: list(44100|48000)
  litcal_url: url
  litcal_calendar: list(general|US|IT|NL|VA|CA)
stage: stable
